name: Update and test the silk formula

# Polls silk-lang/silk for a newer compiler release, tests the regenerated formula on every
# supported platform, and commits it only when every required platform installs and runs it.
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag to pin (default picks stable, or the newest dev release)
        required: false
  repository_dispatch:
    types: [silk-release]
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: update-formula-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Regenerate Formula/silk.rb
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.update.outputs.tag }}
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - name: Regenerate the formula from the selected release
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Branch pushes and PRs test the formula as committed; only polling picks a new release.
          TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag || '' }}
          POLL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' }}
        run: |
          set -euo pipefail
          if [ "$POLL" = true ]; then
            tag=$(scripts/update-formula.sh $TAG)
          else
            tag=$(sed -n 's/^# Generated by scripts\/update-formula.sh from \(.*\)\. Do not edit by hand\.$/\1/p' Formula/silk.rb)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- Formula; then changed=false; else changed=true; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Formula pins $tag (changed: $changed)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: formula
          path: Formula/silk.rb
          retention-days: 7

  test:
    name: brew install on ${{ matrix.name }}
    needs: generate
    if: needs.generate.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-15, required: true }
          - { name: Linux x86-64, os: ubuntu-24.04, required: true }
          # Homebrew's own ARM64 Linux support is newer; a failure here does not block an update.
          - { name: Linux arm64, os: ubuntu-24.04-arm, required: false }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: formula
          path: Formula
      # Homebrew/actions/setup-homebrew re-fetches the tap over anonymous git, which a private
      # tap refuses; linking this checkout in as the tap needs no fetch.
      - name: Set up Homebrew with this checkout as the silk-lang/tap tap
        run: |
          set -euo pipefail
          if ! command -v brew > /dev/null; then
            if [ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
              NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            fi
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          tap="$(brew --repository)/Library/Taps/silk-lang/homebrew-tap"
          mkdir -p "$(dirname "$tap")"
          rm -rf "$tap"
          ln -s "$GITHUB_WORKSPACE" "$tap"
      - name: Install, test and audit the formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          set -euo pipefail
          # A runner image's Homebrew can lag the formula API; brew test then fails to load llvm.
          brew update --quiet
          brew install --formula silk-lang/tap/silk
          brew test silk-lang/tap/silk
          brew audit --formula silk-lang/tap/silk
          silk --version

  commit:
    name: Commit the tested formula
    needs: [generate, test]
    if: >-
      needs.generate.outputs.changed == 'true' && needs.test.result == 'success'
      && github.ref == 'refs/heads/main' && github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: formula
          path: Formula
      - name: Commit and push
        env:
          TAG: ${{ needs.generate.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/silk.rb
          git diff --cached --quiet && exit 0
          git commit -m "silk ${TAG#v}"
          git push origin HEAD:main
